name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build desktop jar
        run: bash desktop/build.sh
      - name: Selftest
        run: java -jar desktop/build/jimi-translator.jar --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: jimi-translator-desktop
          path: desktop/build/jimi-translator.jar

      - name: Rename jar
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp desktop/build/jimi-translator.jar "jimi-translator-desktop-${GITHUB_REF_NAME}.jar"

      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jimi-translator-desktop-${{ github.ref_name }}.jar

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0"

      - name: Build
        run: bash scripts/build-apk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jimi-translator-apk
          path: build/app.apk

      - name: Rename asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/app.apk "jimi-translator-${GITHUB_REF_NAME}.apk"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jimi-translator-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            ## 基米翻译 ${{ github.ref_name }}

            读屏英译中的 Android 悬浮翻译器：只翻屏幕上**新出现**的英文，中文浮在原页上。

            - 📦 **下载**：见下方 Assets 里的 `jimi-translator-${{ github.ref_name }}.apk`
            - 📖 **说明**：https://github.com/${{ github.repository }}#readme
            - 📝 **更新日志**：https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
            - 🛠 **自己构建**：https://github.com/${{ github.repository }}/blob/main/docs/BUILD.md

            ### 安装

            1. 允许「未知来源」安装，装上后打开 App；
            2. 填模型 API key（默认 DeepSeek：`https://api.deepseek.com/v1` + `deepseek-flash`）；
            3. 点「权限设置（开启无障碍服务）」→ 打开「基米翻译 · 读屏服务」；
            4. 浮窗出现后，点「框选」圈一段，或点「自动」整屏跟读。

            > ⚠️ Release 里的 APK 由 CI 签名，与本地自行构建的版本签名不同，不能互相覆盖安装。
            
